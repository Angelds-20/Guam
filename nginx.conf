# ==============================================================================
# CONFIGURACIÓN NGINX REVERSE PROXY - NUAM EXCHANGE
# Ubicación en servidor: /etc/nginx/conf.d/nuam.conf o /etc/nginx/sites-available/nuam
# ==============================================================================

server {
    listen 80;
    server_name _; # Acepta cualquier IP pública o dominio asignado

    # Límite de carga para archivos Excel (.xlsx) y CSV masivos
    client_max_body_size 25M;

    # Compresión de contenido para acelerar carga
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cabeceras de protección OWASP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "origin-when-cross-origin" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }
}
